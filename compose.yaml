services:
  site:
    image: ruby:3.3
    working_dir: /site
    command: >
      sh -c "bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle-cache:/usr/local/bundle
    environment:
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"

volumes:
  bundle-cache:
